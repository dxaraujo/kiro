<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base OKF</title>
<!-- shortcut: grafo via CDN; sem internet a lista e o detalhe funcionam e o grafo não aparece -->
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root { --bg:#fafaf9; --panel:#fff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --chip:#f5f5f4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0c0a09; --panel:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --accent:#60a5fa; --chip:#292524; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; }
header h1 { font-size:16px; margin:0; }
header .stat { color:var(--muted); }
header .stat b { color:var(--fg); }
main { display:grid; grid-template-columns:300px 1fr 360px; height:calc(100vh - 49px); }
aside, section { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
#filters { padding:12px; display:grid; gap:8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
input, select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
#list { list-style:none; margin:0; padding:0; }
#list li { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
#list li:hover, #list li.on { background:var(--chip); }
#list .t { font-weight:600; }
#list .m { color:var(--muted); font-size:12px; }
#graph { background:var(--bg); position:relative; }
#graph .off { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); padding:16px; text-align:center; }
#detail { padding:16px; border-right:0; }
#detail h2 { font-size:16px; margin:0 0 4px; }
#detail h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:16px 0 6px; }
#detail .m { color:var(--muted); }
#detail a { color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.chip { background:var(--chip); border-radius:999px; padding:2px 8px; font-size:12px; }
.link { display:block; cursor:pointer; color:var(--accent); padding:2px 0; }
.rel { color:var(--muted); font-size:12px; }
.flag { font-size:12px; padding:1px 6px; border-radius:4px; background:var(--chip); }
ul.q { margin:0; padding-left:18px; }
@media (max-width: 900px) {
  main { grid-template-columns:1fr; height:auto; }
  aside, section { border-right:0; border-bottom:1px solid var(--line); max-height:60vh; }
  #graph { height:60vh; }
}
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <span class="stat" id="stats"></span>
</header>
<main>
  <aside>
    <div id="filters">
      <input id="q" type="search" placeholder="Filtrar por título, id, resumo, palavra-chave…" aria-label="Filtro">
      <select id="folder" aria-label="Pasta"><option value="">Todas as pastas</option></select>
      <select id="type" aria-label="Tipo"><option value="">Todos os tipos</option></select>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="graph"></section>
  <section id="detail"><p class="m">Selecione um documento na lista ou no grafo.</p></section>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const byPath = Object.fromEntries(D.docs.map(d => [d.path, d]));
const out = {}, inc = {};
for (const l of D.links) { (out[l.from] ||= []).push(l); (inc[l.to] ||= []).push(l); }
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const label = d => (d.id ? d.id + " — " : "") + d.title;

document.getElementById("name").textContent = D.bundle;
const stats = document.getElementById("stats");
for (const [k, v] of [["documentos", D.docs.length], ["enriquecidos", D.docs.filter(d => d.enriched).length],
                      ["links", D.links.length], ["gerado em", D.generated]]) {
  stats.append(el("b", String(v)), " " + k + "   ");
}
const fill = (id, values) => { const s = document.getElementById(id); [...new Set(values)].filter(Boolean).sort().forEach(v => s.append(new Option(v, v))); };
fill("folder", D.docs.map(d => d.folder));
fill("type", D.docs.map(d => d.type));

let network = null, nodes = null;
if (window.vis) {
  nodes = new vis.DataSet(D.docs.map(d => ({ id: d.path, label: d.id || d.title.slice(0, 20), title: label(d), group: d.folder,
    value: (out[d.path] || []).length + (inc[d.path] || []).length + 1, borderWidth: d.enriched ? 1 : 3 })));
  const edges = new vis.DataSet(D.links.map((l, i) => ({ id: i, from: l.from, to: l.to, title: l.rel, arrows: "to",
    dashes: l.rel === "cita" })));
  network = new vis.Network(document.getElementById("graph"), { nodes, edges }, {
    nodes: { shape: "dot", scaling: { min: 8, max: 30 }, font: { size: 12, color: getComputedStyle(document.body).color } },
    edges: { color: { inherit: "from", opacity: 0.5 }, smooth: false },
    physics: { solver: "forceAtlas2Based", stabilization: { iterations: 200 } },
    interaction: { hover: true, tooltipDelay: 150 } });
  network.once("stabilizationIterationsDone", () => network.setOptions({ physics: false }));
  network.on("click", p => p.nodes.length && show(p.nodes[0]));
} else {
  document.getElementById("graph").append(el("div", "Grafo indisponível (sem acesso ao CDN do vis-network). A lista e o detalhe funcionam.", "off"));
}

function matches(d) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const f = document.getElementById("folder").value, t = document.getElementById("type").value;
  if ((f && d.folder !== f) || (t && d.type !== t)) return false;
  if (!q) return true;
  const e = d.enrichment || {};
  return [d.id, d.title, d.description, d.path, e.summary, ...(e.keywords || []), ...(e.entities || [])]
    .some(x => x && String(x).toLowerCase().includes(q));
}

function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const visible = D.docs.filter(matches);
  for (const d of visible) {
    const li = el("li"); li.dataset.path = d.path;
    li.append(el("div", label(d), "t"), el("div", [d.type, d.folder, d.enriched ? "" : "não enriquecido"].filter(Boolean).join(" · "), "m"));
    li.onclick = () => show(d.path);
    list.append(li);
  }
  if (nodes) { const on = new Set(visible.map(d => d.path)); nodes.update(D.docs.map(d => ({ id: d.path, hidden: !on.has(d.path) }))); }
}

function linkList(title, items, key) {
  const box = document.getElementById("detail");
  box.append(el("h3", `${title} (${items.length})`));
  if (!items.length) { box.append(el("div", "—", "m")); return; }
  for (const l of items) {
    const d = byPath[l[key]], a = el("span", d ? label(d) : l[key], "link");
    a.prepend(el("span", l.rel + " · ", "rel"));
    if (d) a.onclick = () => show(d.path);
    box.append(a);
  }
}

function show(path) {
  const d = byPath[path], e = d.enrichment || {}, box = document.getElementById("detail");
  box.replaceChildren(el("h2", label(d)));
  box.append(el("div", [d.type, d.folder].filter(Boolean).join(" · "), "m"));
  const a = el("a", d.path); a.href = "./" + d.path.split("/").map(encodeURIComponent).join("/"); a.target = "_blank";
  box.append(a, " ", el("span", d.enriched ? "enriquecido" : "não enriquecido", "flag"));
  if (d.description) { box.append(el("h3", "Descrição"), el("div", d.description)); }
  box.append(el("h3", "Resumo"), el("div", e.summary || "—", e.summary ? "" : "m"));
  for (const [k, t] of [["keywords", "Palavras-chave"], ["entities", "Entidades"]]) {
    if (!(e[k] || []).length) continue;
    const c = el("div", null, "chips"); e[k].forEach(x => c.append(el("span", x, "chip")));
    box.append(el("h3", t), c);
  }
  if ((e.questions || []).length) { const u = el("ul", null, "q"); e.questions.forEach(x => u.append(el("li", x))); box.append(el("h3", "Perguntas que responde"), u); }
  linkList("Links de saída", out[path] || [], "to");
  linkList("Links de entrada", inc[path] || [], "from");
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("on", li.dataset.path === path));
  if (network) { network.selectNodes([path]); network.focus(path, { scale: 1.2, animation: true }); }
}

["q", "folder", "type"].forEach(id => document.getElementById(id).addEventListener("input", render));
render();
</script>
</body>
</html>
