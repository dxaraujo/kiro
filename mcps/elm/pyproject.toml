[project]
name = "mcp-elm"
version = "3.3.1"
description = "MCP do IBM ELM (EWM, DOORS Next, ETM) para o power sdd: operações que leem o pa do projeto"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Xavier Araújo", email = "danielxaraujo@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2",
    "markdown-it-py>=3",
    "requests>=2.31",
    "rdflib>=7.0",
    "jsonschema>=4",
    "fastembed>=0.4",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/dxaraujo/kiro/tree/main/mcps/elm"

[project.scripts]
mcp-elm = "mcp_elm.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_elm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
