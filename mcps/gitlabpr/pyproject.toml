[project]
name = "mcp-gitlabpr"
version = "1.0.1"
description = "MCP server para merge requests do GitLab (API v4, CE 10.8+): listar, obter, criar e mesclar, só no projeto do workspace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Xavier Araújo", email = "danielxaraujo@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/dxaraujo/kiro/tree/main/mcps/gitlabpr"

[project.scripts]
mcp-gitlabpr = "mcp_gitlabpr.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
