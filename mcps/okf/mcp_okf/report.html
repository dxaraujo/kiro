<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base OKF</title>
<!-- shortcut: bibliotecas via CDN; sem internet a lista funciona, o grafo some e o documento sai como texto -->
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root { --bg:#fafaf9; --panel:#fff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --chip:#f5f5f4; --code:#f5f5f4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0c0a09; --panel:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#292524; --accent:#60a5fa; --chip:#292524; --code:#0c0a09; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; }
header h1 { font-size:16px; margin:0; }
header .stat { color:var(--muted); }
header .stat b { color:var(--fg); }
main { display:grid; grid-template-columns:280px 1fr minmax(380px, 40%); height:calc(100vh - 49px); }
aside, section { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
#filters { padding:12px; display:grid; gap:8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1; }
input, select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
#list { list-style:none; margin:0; padding:0; }
#list li { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
#list li:hover, #list li.on { background:var(--chip); }
#list .t { font-weight:600; }
#list .m { color:var(--muted); font-size:12px; }
#graph { background:var(--bg); position:relative; overflow:hidden; }
#graph .off { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); padding:16px; text-align:center; }
#graph .hint { position:absolute; left:8px; bottom:6px; color:var(--muted); font-size:12px; pointer-events:none; }
#detail { padding:16px 20px; border-right:0; }
#detail h2.title { font-size:18px; margin:0 0 4px; }
#detail h3.sec { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:24px 0 6px; border-top:1px solid var(--line); padding-top:12px; }
#detail .m { color:var(--muted); }
#detail a { color:var(--accent); }
.meta { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin-bottom:8px; }
.chip { background:var(--chip); border-radius:999px; padding:2px 8px; font-size:12px; }
.desc { color:var(--muted); font-style:italic; margin:8px 0; }
.link { display:block; padding:2px 0; text-decoration:none; }
.rel { color:var(--muted); font-size:12px; }
.md { overflow-wrap:anywhere; }
.md h1, .md h2, .md h3, .md h4 { line-height:1.25; margin:20px 0 8px; }
.md h1 { font-size:20px; } .md h2 { font-size:17px; } .md h3 { font-size:15px; } .md h4 { font-size:14px; }
.md table { border-collapse:collapse; display:block; overflow:auto; margin:8px 0; }
.md th, .md td { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
.md th { background:var(--chip); }
.md code { background:var(--code); padding:1px 4px; border-radius:4px; font-size:13px; }
.md pre { background:var(--code); padding:10px; border-radius:6px; overflow:auto; }
.md pre code { padding:0; }
.md blockquote { margin:8px 0; padding:0 12px; border-left:3px solid var(--line); color:var(--muted); }
.md img { max-width:100%; }
pre.raw { white-space:pre-wrap; font:13px/1.5 ui-monospace, monospace; }
@media (max-width: 900px) {
  main { grid-template-columns:1fr; height:auto; }
  aside, section { border-right:0; border-bottom:1px solid var(--line); max-height:60vh; }
  #graph { height:60vh; }
  #detail { max-height:none; }
}
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <span class="stat" id="stats"></span>
</header>
<main>
  <aside>
    <div id="filters">
      <input id="q" type="search" placeholder="Filtrar por título, id, descrição…" aria-label="Filtro">
      <select id="folder" aria-label="Pasta"><option value="">Todas as pastas</option></select>
      <select id="type" aria-label="Tipo"><option value="">Todos os tipos</option></select>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="graph" aria-label="Grafo de links"></section>
  <section id="detail"><p class="m">Selecione um documento na lista ou no grafo.</p></section>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const byPath = Object.fromEntries(D.docs.map(d => [d.path, d]));
const out = {}, inc = {};
for (const l of D.links) { (out[l.from] ||= []).push(l); (inc[l.to] ||= []).push(l); }
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const label = d => (d.id ? d.id + " — " : "") + d.title;
const docHash = path => "#doc=" + encodeURIComponent(path);
const go = path => { location.hash = docHash(path); };

document.getElementById("name").textContent = D.bundle;
const stats = document.getElementById("stats");
for (const [k, v] of [["documentos", D.docs.length], ["links", D.links.length], ["gerado em", D.generated]]) {
  stats.append(el("b", String(v)), " " + k + "   ");
}
const fill = (id, values) => { const s = document.getElementById(id); [...new Set(values)].filter(Boolean).sort().forEach(v => s.append(new Option(v, v))); };
fill("folder", D.docs.map(d => d.folder));
fill("type", D.docs.map(d => d.type));

// --- grafo 3D
const box = document.getElementById("graph");
let graph = null, visible = new Set(D.docs.map(d => d.path));
if (window.ForceGraph3D) {
  const css = getComputedStyle(document.documentElement);
  graph = ForceGraph3D()(box)
    .width(box.clientWidth).height(box.clientHeight)
    .backgroundColor(css.getPropertyValue("--bg").trim())
    .graphData({ nodes: D.docs.map(d => ({ id: d.path, folder: d.folder,
                   val: (out[d.path] || []).length + (inc[d.path] || []).length + 1 })),
                 links: D.links.map(l => ({ source: l.from, target: l.to, rel: l.rel })) })
    .nodeAutoColorBy("folder")
    .nodeLabel(n => { const d = byPath[n.id]; return `<b>${esc(label(d))}</b><br>${esc([d.type, d.folder].filter(Boolean).join(" · "))}`; })
    .nodeOpacity(0.9)
    .linkLabel(l => esc(l.rel))
    .linkColor(l => l.rel === "cita" ? css.getPropertyValue("--muted").trim() : css.getPropertyValue("--accent").trim())
    .linkOpacity(0.35)
    .linkDirectionalArrowLength(3).linkDirectionalArrowRelPos(1)
    .linkDirectionalParticles(l => l.rel === "cita" ? 0 : 1).linkDirectionalParticleWidth(1.2)
    .onNodeClick(n => go(n.id));
  new ResizeObserver(() => graph.width(box.clientWidth).height(box.clientHeight)).observe(box);
  box.append(el("div", "arraste para girar · roda para zoom · clique abre o documento", "hint"));
} else {
  box.append(el("div", "Grafo indisponível (sem acesso ao CDN). A lista e os documentos funcionam.", "off"));
}

function esc(s) { const e = document.createElement("span"); e.textContent = s ?? ""; return e.innerHTML; }

function focusNode(path) {
  if (!graph) return;
  const n = graph.graphData().nodes.find(n => n.id === path);
  if (!n || n.x === undefined) return;
  const r = 1 + 80 / (Math.hypot(n.x, n.y, n.z) || 1);
  graph.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 1000);
}

// --- lista
function matches(d) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const f = document.getElementById("folder").value, t = document.getElementById("type").value;
  if ((f && d.folder !== f) || (t && d.type !== t)) return false;
  return !q || [d.id, d.title, d.description, d.path].some(x => x && String(x).toLowerCase().includes(q));
}

function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const shown = D.docs.filter(matches);
  for (const d of shown) {
    const li = el("li"); li.dataset.path = d.path;
    li.append(el("div", label(d), "t"), el("div", [d.type, d.folder].filter(Boolean).join(" · "), "m"));
    li.onclick = () => go(d.path);
    list.append(li);
  }
  visible = new Set(shown.map(d => d.path));
  if (graph) graph.nodeVisibility(n => visible.has(n.id))  // função nova a cada filtro: o grafo reaplica
    .linkVisibility(l => visible.has(l.source.id ?? l.source) && visible.has(l.target.id ?? l.target));
}

// --- documento renderizado
function body(d) {
  const div = el("div", null, "md");
  if (!(window.marked && window.DOMPurify)) { div.append(el("pre", d.body, "raw")); return div; }
  div.innerHTML = DOMPurify.sanitize(marked.parse(d.body));  // texto vem do ALM: nunca HTML sem sanitizar
  const base = new URL(d.path.split("/").map(encodeURIComponent).join("/"), location.href);
  for (const a of div.querySelectorAll("a[href]")) {
    const href = a.getAttribute("href");
    if (href.startsWith("#doc=")) continue;
    a.href = new URL(href, base).href;  // relativo ao .md, não ao okf.html
    if (!href.startsWith("#")) { a.target = "_blank"; a.rel = "noopener"; }
  }
  for (const img of div.querySelectorAll("img[src]")) img.src = new URL(img.getAttribute("src"), base).href;
  return div;
}

function linkList(box, title, items, key) {
  box.append(el("h3", `${title} (${items.length})`, "sec"));
  if (!items.length) { box.append(el("div", "—", "m")); return; }
  for (const l of items) {
    const d = byPath[l[key]], a = el("a", d ? label(d) : l[key], "link");
    a.prepend(el("span", l.rel + " · ", "rel"));
    if (d) a.href = docHash(d.path);
    box.append(a);
  }
}

function show(path) {
  const d = byPath[path], box = document.getElementById("detail");
  box.replaceChildren(el("h2", label(d), "title"));
  const meta = el("div", null, "meta");
  for (const x of [d.type, d.folder]) if (x) meta.append(el("span", x, "chip"));
  const raw = el("a", "abrir .md"); raw.href = d.path.split("/").map(encodeURIComponent).join("/"); raw.target = "_blank";
  meta.append(raw);
  box.append(meta);
  if (d.description && !d.body.includes(d.description)) box.append(el("div", d.description, "desc"));
  box.append(body(d));
  linkList(box, "Links de saída", out[path] || [], "to");
  linkList(box, "Links de entrada", inc[path] || [], "from");
  box.scrollTop = 0;
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("on", li.dataset.path === path));
  document.querySelector("#list li.on")?.scrollIntoView({ block: "nearest" });
  focusNode(path);
}

function fromHash() {
  const path = location.hash.startsWith("#doc=") ? decodeURIComponent(location.hash.slice(5)) : null;
  if (path && byPath[path]) show(path);
}

["q", "folder", "type"].forEach(id => document.getElementById(id).addEventListener("input", render));
window.addEventListener("hashchange", fromHash);
render();
fromHash();
</script>
</body>
</html>
