[project]
name = "mcp-okf"
version = "0.2.2"
description = "MCP server de base de conhecimento sobre bundles OKF (alm-sync): indexação, enriquecimento e busca semântica"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Xavier Araújo", email = "danielxaraujo@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2",
    "qdrant-client[fastembed]>=1.12",
    "pyyaml>=6",
    "markdown-it-py>=3",
]

[project.scripts]
mcp-okf = "mcp_okf.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
